[project]
name = "offerloop"
version = "1.0.0"
description = "AI求职教练：反馈→清洗→记忆→信号→审批→评估→简报 自动化管道"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "chromadb>=0.5.0",
    "openai>=1.50.0",
    "pandas>=2.2.0",
    "hdbscan>=0.8.0",
    "scikit-learn>=1.5.0",
    "streamlit>=1.38.0",
    "jinja2>=3.1.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
