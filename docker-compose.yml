# OfferLoop 一键部署
# 用法：docker compose up -d --build   （首次构建约 5-10 分钟）
# 访问：http://localhost:8000

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env                      # 注入 DEEPSEEK_API_KEY 等（.env 已在 .gitignore/.dockerignore）
    environment:
      # 复用宿主机 Ollama（Windows Docker Desktop / Linux 服务器均可用）：
      #   - Docker Desktop：host.docker.internal 指向宿主机
      #   - Linux 服务器：OLLAMA 装宿主机，靠 extra_hosts 的 host-gateway 打通
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # 若改用容器化 Ollama（下方注释的服务），改成：OLLAMA_BASE_URL: http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 下把 host.docker.internal 映射到宿主机
    volumes:
      - ./data:/app/data           # Chroma 向量库 + runs + spaces 持久化，容器删了数据还在
    restart: unless-stopped

  # ── 可选：全容器化 Ollama（本机/服务器没装 Ollama 时才需要）──
  # 启用步骤：
  #   1. 取消下方注释，并把 app.environment 的 OLLAMA_BASE_URL 改为 http://ollama:11434
  #   2. docker compose up -d
  #   3. docker compose exec ollama ollama pull shaw/dmeta-embedding-zh:latest
  #   4. 首次拉模型约 1-2 GB，拉完重启 app：docker compose restart app
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   restart: unless-stopped

volumes:
  ollama_data:
